services:

  api:
    build: .
    container_name: controle_insumos_api
    restart: always

    ports:
      - "127.0.0.1:3000:3000"

    env_file:
      - .env

    networks:
      - rede_api

    mem_limit: 256m

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


networks:
  rede_api:
    external: true